
dataset:
  name: "cifar100"
  input_shape: [32, 32, 3]
  root: "./data"
  batch_size: 128
  num_workers: 0
  val_split: 0.1
  forget_split: 0.3
  seed: 1

model:
  name: "tiny_net_cifar100"
  n_classes: 100

training:
  epochs: 400
  optim: "SGD"
  max_lr: 0.06
  momentum: 0
  weight_decay: 0.0005
  lr_schedule: "onecycle"
  pretrained: false

unlearning:
  epochs: 50
  optim: "SGD"
  momentum: 0
  weight_decay: 0
  lr_schedule: "constant"
  noise_schedule: "constant"
  max_lr: 0.001
  init_model_clip: 30
  init_model_clip_type: "clip"
  init_sigma: 0
  algorithm: 'contractive_coefficients'
  delta: 0.00001
  contractive_coefficients:
    epsilon_target: 10
    sigma: 0.02
    model_clip: 0.1
    grad_clip: False
    noise_addition_after_projection: True
    noise_addition_before_projection: False

post_unlearning:
  optim: "SGD"
  momentum: 0
  weight_decay: 0.0005
  lr_schedule: "onecycle"
  max_lr: 0.1
  post_unlearn_clip: False

wandb:
  project: "machine-unlearning"
  entity: "sahasras-stanford-university"
  log_dir: "./wandb_logs"

secure_rng: False
save_every: 1
global_seed: 1
  