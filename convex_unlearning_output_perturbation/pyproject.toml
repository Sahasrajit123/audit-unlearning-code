[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "convex-unlearning-audit"
version = "0.1.0"
description = "Empirical (ε, δ)-DP and ρ-zCDP audits of certified unlearning for convex losses: Newton-step unlearning and output perturbation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ email = "sahasras@stanford.edu" }]
dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

# Flat layout: every module lives at the repo root and imports its siblings by name.
[tool.setuptools]
py-modules = [
    "avg_v_convex",
    "cubic_loss",
    "cum_runs_eps_lab",
    "data_generation",
    "data_persistence",
    "gaussian_mechanism",
    "lipschitz_constants",
    "membership_inference",
    "op_data_generation",
    "op_membership_inference",
    "output_perturbation",
    "run_output_perturbation_attack",
    "run_privacy_attack_final",
    "training",
    "unlearning",
    "zcdp_pairwise",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: end-to-end runs of the experiment scripts (deselect with -m 'not slow')"]
