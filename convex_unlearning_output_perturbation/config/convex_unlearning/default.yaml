config_id: default
random_state: 42
loss: logistic

data:
  n_retain: 40500
  n_forget: 4500
  d: 20
  theta_norm: 1.0
  forget_norm: 10.0
  link_function: f1
  eta: 0.8
  zeta: 0.9
  feature_distribution: gaussian
  n_val: 5000
  n_test: 10000

training:
  per_sample_reg: 1.0e-5
  max_iter: 1000

sample_config:
  n_samples_per_dist: 1000
  n_test: 500
  confidence: 0.95   # Clopper-Pearson for TPR/FPR and ε_emp^lower
  ci_delta: 0.05     # confidence level for ε_lb (avg-v test bound)

privacy:
  delta: 0.01

epsilon_values: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
