# Single-partition cubic: forget along e1 only.
# Note: retain_include_e2 is no longer supported; retain set is always n_retain zeros.
config_id: cubic_tighten_single_partition_retain_e2
random_state: 42
loss: cubic

n_partition: 1

cubic:
  M: 0.005
  B: 9.09
  data_R: 20

data:
  n_retain: 1000
  n_forget_per_partition: 60
  d: 8
  n_val: 200
  n_test: 400

training:
  per_sample_reg: 0.1
  max_iter: 1000

sample_config:
  n_samples_per_dist: 500
  n_test: 100000
  ci_delta: 0.05

privacy:
  delta: 0.01

epsilon_values: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0, 20.0, 50.0]
